<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyLink</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px 28px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #111; }
    p { font-size: 14px; color: #666; margin-bottom: 24px; }
    a.link-btn {
      display: block;
      background: #111827;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    a.link-btn:hover { background: #374151; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MyLink</h1>
    <p>나만의 링크 모음 페이지입니다.</p>
    <a class="link-btn" href="https://github.com" target="_blank">GitHub 바로가기</a>
    <a class="link-btn" href="https://www.naver.com" target="_blank">원하는 사이트 이름</a>
  </div>
</body>
</html>
