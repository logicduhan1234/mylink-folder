<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyLink</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px 28px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 8px 0; color: #111; }
    p { font-size: 14px; color: #666; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MyLink</h1>
    <p>나만의 링크 모음 페이지입니다.</p>
  </div>
</body>
</html>
